<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .caja { stroke: #374151; stroke-width: 1.3; rx: 8; }
      .t { font-weight: bold; font-size: 13px; fill: #111827; }
      .m { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #1f2937; }
      .n { font-size: 11px; fill: #4b5563; }
      .l { stroke: #374151; stroke-width: 1.4; fill: none; marker-end: url(#f); }
      .aw { stroke: #b91c1c; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#fr); }
      .dis { stroke: #374151; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#f); }
      .et { font-size: 12px; fill: #111827; font-style: italic; }
    </style>
  </defs>
  <rect width="1080" height="610" fill="#ffffff"/>

  <!-- Planta -->
  <rect class="caja" x="20" y="470" width="150" height="80" fill="#e5e7eb"/>
  <text class="t" x="95" y="495" text-anchor="middle">Coche F1</text>
  <text class="n" x="95" y="512" text-anchor="middle">(Gazebo, cinemático)</text>
  <text class="m" x="95" y="533" text-anchor="middle">ψ' = w,  y' ≈ v·ψ</text>

  <rect class="caja" x="20" y="240" width="150" height="70" fill="#e5e7eb"/>
  <text class="t" x="95" y="268" text-anchor="middle">Cámara</text>
  <text class="n" x="95" y="286" text-anchor="middle">20 Hz · 640×480 BGR</text>

  <path class="l" d="M95,470 V310"/>
  <text class="et" x="102" y="395">imagen</text>
  <path class="l" d="M170,275 H200"/>

  <!-- Percepción -->
  <rect class="caja" x="200" y="190" width="210" height="190" fill="#dbeafe"/>
  <text class="t" x="305" y="214" text-anchor="middle">Percepción</text>
  <text class="n" x="215" y="238">máscara HSV del rojo</text>
  <text class="n" x="215" y="256">17 scanlines + banda horizonte</text>
  <text class="n" x="215" y="274">píxel → suelo:</text>
  <text class="m" x="215" y="292">Z = F·H/(y−CY)</text>
  <text class="m" x="215" y="308">Y = −H·(x−CX)/(y−CY)</text>
  <text class="n" x="215" y="328">parábola Y(Z) → posición, rumbo</text>
  <text class="n" x="215" y="346">círculo → curvatura κ, κ_lejos</text>
  <text class="n" x="215" y="364">filas cercanas → e_px</text>

  <!-- Salidas de la percepción -->
  <path class="l" d="M410,205 H430 V61 H520"/>
  <text class="et" x="514" y="54" text-anchor="end">κ_lejos</text>
  <path class="l" d="M410,240 H450 V166 H520"/>
  <text class="et" x="514" y="159" text-anchor="end">Y(Z), e_px</text>
  <path class="l" d="M410,281 H520"/>
  <text class="et" x="514" y="274" text-anchor="end">e_hor</text>
  <path class="l" d="M410,370 H520"/>
  <text class="et" x="514" y="363" text-anchor="end">κ</text>

  <!-- Velocidad -->
  <rect class="caja" x="520" y="30" width="200" height="62" fill="#dcfce7"/>
  <text class="t" x="620" y="50" text-anchor="middle">Perfil de velocidad</text>
  <text class="m" x="620" y="68" text-anchor="middle">v_max/(1+k_v_curva·|κ_lejos|)</text>
  <text class="n" x="620" y="84" text-anchor="middle">recortado a [v_min, v_max]</text>
  <path class="l" d="M720,61 H760"/>
  <text class="et" x="740" y="54" text-anchor="middle">v_ref</text>
  <rect class="caja" x="760" y="30" width="170" height="62" fill="#dcfce7"/>
  <text class="t" x="845" y="50" text-anchor="middle">Rampa</text>
  <text class="n" x="845" y="68" text-anchor="middle">aceleración ≤ a_sub</text>
  <text class="n" x="845" y="84" text-anchor="middle">frenada ≤ a_fren (0 = libre)</text>
  <path class="l" d="M930,61 H1050 V530 H170"/>
  <text class="et" x="1040" y="54">v</text>

  <!-- Giro -->
  <rect class="caja" x="520" y="130" width="200" height="72" fill="#ffedd5"/>
  <text class="t" x="620" y="150" text-anchor="middle">Mirada adelantada</text>
  <text class="m" x="620" y="168" text-anchor="middle">L = v·t_mirar (≥ z_mirar_min)</text>
  <text class="m" x="620" y="186" text-anchor="middle">e = −F·Y(L)/L</text>
  <path class="l" d="M720,166 H760"/>
  <text class="et" x="740" y="159" text-anchor="middle">e</text>

  <rect class="caja" x="760" y="105" width="170" height="150" fill="#ffedd5"/>
  <text class="t" x="845" y="125" text-anchor="middle">PID del T03</text>
  <text class="m" x="772" y="145">Kp' = Kp/(1+kv_kp·v)</text>
  <text class="m" x="772" y="165">P = −Kp'·e</text>
  <text class="m" x="772" y="185">D = Kp'·Td/T·Δe_f</text>
  <text class="m" x="772" y="203">e_f filtrada, τd=Td/N</text>
  <text class="m" x="772" y="223">I = 0  (Ti = 0)</text>
  <text class="n" x="772" y="243">integración condicional</text>
  <path class="l" d="M930,180 H980 V278"/>
  <text class="et" x="986" y="230">P+I+D</text>

  <rect class="caja" x="520" y="250" width="200" height="62" fill="#cffafe"/>
  <text class="t" x="620" y="270" text-anchor="middle">Banda del horizonte</text>
  <text class="m" x="620" y="290" text-anchor="middle">u_hor = −k_hor·e_hor</text>
  <text class="n" x="620" y="305" text-anchor="middle">filas fila_hor … +n_filas_hor</text>
  <path class="l" d="M720,281 H930 V300 H958"/>
  <text class="et" x="830" y="274" text-anchor="middle">u_hor</text>

  <rect class="caja" x="520" y="340" width="200" height="62" fill="#f3e8ff"/>
  <text class="t" x="620" y="360" text-anchor="middle">Prealimentación (FF)</text>
  <text class="m" x="620" y="380" text-anchor="middle">u_ff = k_ff·v·κ</text>
  <text class="n" x="620" y="395" text-anchor="middle">giro que pide la curva</text>
  <path class="l" d="M720,370 H945 V312 H960"/>
  <text class="et" x="830" y="363" text-anchor="middle">u_ff</text>

  <!-- Suma y saturación -->
  <circle cx="980" cy="300" r="22" fill="#f9fafb" stroke="#374151" stroke-width="1.4"/>
  <text x="980" y="307" text-anchor="middle" font-size="20" fill="#111827">Σ</text>
  <path class="l" d="M980,322 V380"/>
  <rect class="caja" x="925" y="380" width="110" height="56" fill="#fee2e2"/>
  <text class="t" x="980" y="402" text-anchor="middle">Saturación</text>
  <text class="m" x="980" y="422" text-anchor="middle">|w| ≤ w_max</text>
  <path class="l" d="M980,436 V495 H170"/>
  <text class="et" x="990" y="470">w</text>
  <path class="aw" d="M925,425 H860 V255"/>
  <text x="866" y="445" font-size="11" fill="#b91c1c">anti-windup</text>

  <!-- Vigilante -->
  <rect class="caja" x="200" y="410" width="210" height="44" fill="#fef9c3"/>
  <text class="t" x="305" y="428" text-anchor="middle">Vigilante</text>
  <text class="n" x="305" y="445" text-anchor="middle">sin línea o atasco → vuelve a la salida</text>
  <path class="dis" d="M305,380 V410"/>
  <path class="dis" d="M200,432 H180 V470"/>

  <!-- Leyenda -->
  <text class="n" x="20" y="580">v (salida de la rampa) entra también en la mirada (L), en Kp' y en u_ff.   e usa e_px de las filas cercanas si t_mirar = 0.</text>
  <text class="n" x="20" y="598">Se ejecuta un paso por fotograma nuevo (T = dt medido ≈ 50 ms). Discontinuo: señales de supervisión.</text>
</svg>
